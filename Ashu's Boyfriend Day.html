<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ashu's Boyfriend Day</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ THEME ============ */
  :root {
    --pink: #ffc8dd;
    --pink-deep: #ff8fb8;
    --cream: #fff8ee;
    --lavender: #cdb4f6;
    --lavender-soft: #ebe0ff;
    --peach: #ffd3b6;
    --ink: #5b3a54;
    --shadow: 0 10px 25px rgba(255, 143, 184, 0.28);
    --radius: 26px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--cream) 0%, #fff0f6 45%, var(--cream) 100%);
    overflow-x: hidden;
    line-height: 1.6;
  }
  h1, h2, h3, .btn { font-family: 'Fredoka', sans-serif; }
  img { max-width: 100%; }

  section { padding: 72px 20px; max-width: 1100px; margin: 0 auto; position: relative; }
  .section-title { text-align: center; font-size: clamp(1.8rem, 6vw, 2.6rem); margin-bottom: 8px; }
  .section-sub { text-align: center; margin-bottom: 36px; opacity: .8; }

  /* Buttons */
  .btn {
    display: inline-block; border: none; cursor: pointer;
    background: var(--pink-deep); color: #fff;
    font-size: 1.1rem; font-weight: 600;
    padding: 14px 30px; border-radius: 999px;
    box-shadow: var(--shadow); text-decoration: none;
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), box-shadow .25s;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(-4px) scale(1.06); box-shadow: 0 14px 28px rgba(255, 143, 184, .45); }
  .btn:active { transform: scale(.96); }
  .btn.lav { background: var(--lavender); }

  /* Scroll reveal (applied to wrappers so it never fights with hover/tilt transforms) */
  .reveal { transition: opacity .8s ease, transform .8s ease; }
  .reveal.hide { opacity: 0; transform: translateY(30px); }

  /* ============ FLOATING HEARTS (background) ============ */
  #hearts-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .float-heart { position: absolute; bottom: -40px; animation: floatUp linear forwards; opacity: .7; }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .7; }
    100% { transform: translateY(-110vh) translateX(var(--drift)) rotate(25deg); opacity: 0; }
  }
  main, footer { position: relative; z-index: 1; }

  /* ============ HERO ============ */
  .hero {
    max-width: none; padding-block: 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    background: linear-gradient(160deg, var(--pink) 0%, var(--lavender-soft) 55%, var(--peach) 120%);
    overflow: hidden;
  }
  .hero-photo {
    position: relative; width: clamp(170px, 48vw, 260px); aspect-ratio: 1;
    border-radius: 50%; border: 8px solid #fff;
    box-shadow: var(--shadow), 0 0 0 10px rgba(255, 255, 255, .45);
    margin-bottom: 18px;
  }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 55% 40%; border-radius: 50%; display: block; }
  .hero-cat {
    position: absolute; right: -22px; bottom: -16px;
    font-size: clamp(3rem, 12vw, 4.6rem);
    animation: bob 2.4s ease-in-out infinite; display: inline-block;
    filter: drop-shadow(0 4px 6px rgba(91, 58, 84, .25));
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
  .hero h1 { font-size: clamp(2.2rem, 9vw, 4.5rem); line-height: 1.1; margin: 10px 0 14px; text-shadow: 3px 3px 0 rgba(255,255,255,.7); }
  .hero p { font-size: clamp(1rem, 3.6vw, 1.35rem); max-width: 520px; margin: 0 auto 28px; }
  .sticker { position: absolute; font-size: clamp(1.6rem, 6vw, 2.6rem); animation: bob 3.2s ease-in-out infinite; }
  .s1 { top: 8%; left: 8%; } .s2 { top: 16%; right: 10%; animation-delay: .6s; }
  .s3 { bottom: 12%; left: 10%; animation-delay: 1.1s; } .s4 { bottom: 18%; right: 8%; animation-delay: 1.7s; }
  .s5 { top: 46%; left: 4%; animation-delay: .3s; } .s6 { top: 40%; right: 4%; animation-delay: 1.4s; }

  /* ============ REASON CARDS (flip) ============ */
  .reasons-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
  .flip { perspective: 900px; height: 190px; background: none; border: none; cursor: pointer; font: inherit; color: inherit; }
  .flip-inner { position: relative; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.34, 1.3, .64, 1); transform-style: preserve-3d; }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }
  @media (hover: hover) { .flip:hover .flip-inner { transform: rotateY(180deg); } }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; text-align: center;
  }
  .face.front { background: #fff; border: 3px dashed var(--pink-deep); }
  .face.front .emoji { font-size: 2.8rem; }
  .face.front h3 { font-size: 1.3rem; margin-top: 6px; }
  .face.back { background: linear-gradient(135deg, var(--lavender), var(--pink)); transform: rotateY(180deg); font-weight: 700; }

  /* ============ MEMES ============ */
  .meme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  .meme-card {
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; height: 100%;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }
  .meme-card:hover { transform: translateY(-6px) rotate(-1deg); }
  .meme-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: var(--lavender-soft); }
  .meme-card p { padding: 14px 16px 18px; font-weight: 700; text-align: center; }

  /* ============ POLAROIDS ============ */
  .polaroids { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 34px 28px; padding: 14px 0; }
  .polaroid {
    position: relative; background: #fff; padding: 12px 12px 16px; width: min(320px, 86vw);
    box-shadow: 0 10px 22px rgba(91, 58, 84, .18); border-radius: 6px;
    transform: rotate(var(--tilt, 0deg)); cursor: pointer;
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .polaroid::before { /* washi tape */
    content: ''; position: absolute; top: -13px; left: 50%; width: 80px; height: 26px;
    background: rgba(205, 180, 246, .75); transform: translateX(-50%) rotate(-3deg); border-radius: 3px;
  }
  .polaroid:nth-child(even)::before { background: rgba(255, 200, 221, .85); transform: translateX(-50%) rotate(4deg); }
  .polaroid:hover { transform: rotate(0deg) scale(1.06); z-index: 2; }
  .polaroid img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--peach); }
  .polaroid figcaption { font-family: 'Fredoka', sans-serif; text-align: center; margin-top: 12px; font-size: 1.05rem; }

  /* ============ LETTER ============ */
  .letter {
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
    padding: clamp(26px, 6vw, 46px); max-width: 680px; margin: 0 auto; position: relative;
    border: 3px solid var(--pink);
  }
  .letter::before { content: '💌'; position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 2.6rem; }
  #letter-text { white-space: pre-wrap; font-size: clamp(1rem, 3.6vw, 1.15rem); }
  #letter-text .ghost { visibility: hidden; } /* reserves space so the card doesn't jump while typing */
  .caret::after { content: '|'; animation: blink 1s steps(1) infinite; color: var(--pink-deep); position: absolute; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ============ SURPRISE + POP-UPS ============ */
  .surprise { text-align: center; }
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(91, 58, 84, .55); backdrop-filter: blur(4px);
  }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--cream); border-radius: var(--radius); padding: 26px 22px; max-width: 440px; width: 100%;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); border: 4px solid var(--pink-deep);
    animation: pop .5s cubic-bezier(.34, 1.56, .64, 1);
    max-height: 92vh; overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-box img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 18px; margin-bottom: 14px; background: var(--lavender-soft); }
  .modal-box img.contain { object-fit: contain; max-height: 62vh; }
  .modal-box h3 { font-size: 1.6rem; margin-bottom: 6px; }
  .modal-box p { margin-bottom: 18px; }
  .confetti { position: fixed; top: -30px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) translateX(var(--drift)) rotate(540deg); } }

  /* ============ MUSIC + FOOTER ============ */
  #music-btn {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
    background: #fff; font-size: 1.5rem; box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
  }
  #music-btn:hover { transform: scale(1.12); }
  footer { text-align: center; padding: 40px 20px 60px; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .reveal.hide { opacity: 1; transform: none; }
    #hearts-layer { display: none; }
  }

  #toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #fff; color: var(--ink); padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow); z-index: 70; font-weight: 700; max-width: calc(100% - 32px); text-align: center; }
</style>
<div id="hearts-layer" aria-hidden="true"></div>

<main>
  <!-- 1. HERO -->
  <section class="hero" id="top">
    <span class="sticker s1" aria-hidden="true">🐾</span>
    <span class="sticker s2" aria-hidden="true">⭐</span>
    <span class="sticker s3" aria-hidden="true">💖</span>
    <span class="sticker s4" aria-hidden="true">🐾</span>

  <!-- 4. PHOTOS -->

</main>

<!-- Surprise pop-up -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">

<script>
/* =====================================================

const HIM = "Ashu";   // his name
const ME  = "Ashi";   // your name

const CONFIG = {
  boyfriendName: HIM,
  myName: ME,

  heroImage: "@outdoors",
  heroImageAlt: "Ashi and Ashu smiling together outdoors",
  heroSubtitle: "Another day, another reason I'm lucky I met you. This whole page is 100% for you. 🐾",

  // Flip cards: front title + emoji, back message
  reasons: [
    { emoji: "😂", title: "You make me laugh",  text: "Even when it's the 3rd time telling the same joke. Especially then." },
    { emoji: "🤗", title: "Your hugs",          text: "Best place on Earth. Zero complaints. Five stars." },
    { emoji: "🍕", title: "You share food",     text: "Which is basically a marriage proposal. Thank you." },
    { emoji: "🌙", title: "You listen to me",   text: "Even my random 2am thoughts. You're a hero." },
    { emoji: "💪", title: "You support me",     text: "You believe in me more than I do. Don't stop!" },
    { emoji: "🐱", title: "You tolerate my cat memes", text: "Which is why I'm sending you even more. Sorry (not sorry)." }
  ],

  // Cat memes. Drop your own pictures at these paths to replace the drawn cats.
  // (mood: round | side | sleepy | heart | shock | happy;  extra: phone | fries | none)
  memes: [
    { src: "images/meme1.jpg", alt: "Cat staring at a phone, waiting",   mood: "round",  extra: "phone", caption: "Me waiting for your text 📱" },
    { src: "images/meme2.jpg", alt: "Suspicious cat with fries",         mood: "side",   extra: "fries", caption: "You when I say \"I'm not hungry\" 🍟" },
    { src: "images/meme3.jpg", alt: "Shocked cat",                       mood: "shock",  extra: "none",  caption: "Me when you say \"we need to talk\" 😳 (it was about dinner)" },
    { src: "images/meme4.jpg", alt: "Sleepy cat",                        mood: "sleepy", extra: "none",  caption: "Us at 2am: \"just five more minutes\" 😴" },
    { src: "images/meme5.jpg", alt: "Cat with heart eyes",               mood: "heart",  extra: "none",  caption: "Me, every time you smile 😍" },
    { src: "images/meme6.jpg", alt: "Happy cat",                         mood: "happy",  extra: "none",  caption: "Us, every single day 💞" }
  ],

  // Polaroids. pos = which part of the photo to keep when cropping.
  photos: [
    { src: "@pink",     alt: "Ashu and Ashi smiling at a leafy cafe",       caption: "Smiles for days 😁",                 pos: "50% 40%" },
    { src: "@looking",  alt: "Ashi and Ashu smiling and looking at each other", caption: "That look 🥹",                  pos: "15% 50%" },
    { src: "@outdoors", alt: "Ashi and Ashu cheek to cheek outdoors",       caption: "Adventure partner 🌿",               pos: "50% 45%" },
    { src: "@jacket",   alt: "Ashi smiling and Ashu with a serious face",   caption: "Your serious face, my giggle 😜",    pos: "50% 40%" }
  ],

  letter:
`Hey ${HIM},

Happy Boyfriend Day! I wanted to make something special, so I made you a whole website (yes, really, I'm that kind of girlfriend).

Thank you for being my safe place, my best friend and my favorite human. You make boring days fun and hard days easier. Also, thank you for posing for every photo, even when your serious face shows up. 😜

I promise to keep stealing your fries, sending you cat memes at the worst times, and loving you more every day.

Forever yours,
${ME} 💕`,

  surprise: {
    image: "@looking",   // swap for a cat gif/meme: "images/surprise.gif"
    alt: "Ashi and Ashu smiling at each other",
    title: "Surprise! 🎉",
    message: "You're the best boyfriend ever. I love you more than cats love boxes. 📦🐱"
  },

  musicSrc: "music.mp3"  // optional: put an mp3 next to this file. Off by default.
};

/* =====================================================
   ⚙️ CODE: you shouldn't need to edit below this line
   ===================================================== */
window.addEventListener('DOMContentLoaded', () => {
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const resolveSrc = (s) => (s && s[0] === '@') ? PHOTO_DATA[s.slice(1)] : s;

  /* ---------- Drawn cat (used when a meme image file is missing) ---------- */
  const furs = ['#ffb86b', '#cfc8dd', '#fff0d6', '#ffffff', '#b9a3ee', '#ffcfa8'];
  const bgs  = ['#ebe0ff', '#ffe4ef', '#e0f4ff', '#fff1d6', '#ffe4ef', '#e6f7e8'];
  function catSVG(mood, extra, i) {
    const fur = furs[i % furs.length], bg = bgs[i % bgs.length], ink = '#3b2a38';
    const eyes = {
      round:  `<circle cx="150" cy="198" r="24" fill="#fff"/><circle cx="250" cy="198" r="24" fill="#fff"/><circle cx="152" cy="202" r="13" fill="${ink}"/><circle cx="252" cy="202" r="13" fill="${ink}"/><circle cx="157" cy="196" r="4" fill="#fff"/><circle cx="257" cy="196" r="4" fill="#fff"/>`,
      side:   `<circle cx="150" cy="198" r="24" fill="#fff"/><circle cx="250" cy="198" r="24" fill="#fff"/><circle cx="163" cy="200" r="11" fill="${ink}"/><circle cx="263" cy="200" r="11" fill="${ink}"/><path d="M122 168 L176 178 M278 168 L224 178" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`,
      sleepy: `<path d="M126 202 Q150 224 174 202 M226 202 Q250 224 274 202" stroke="${ink}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
      happy:  `<path d="M126 208 Q150 182 174 208 M226 208 Q250 182 274 208" stroke="${ink}" stroke-width="7" fill="none" stroke-linecap="round"/>`,
      heart:  `<text x="150" y="220" font-size="58" text-anchor="middle" fill="#ff5c8a">♥</text><text x="250" y="220" font-size="58" text-anchor="middle" fill="#ff5c8a">♥</text>`,
      shock:  `<circle cx="150" cy="198" r="28" fill="#fff"/><circle cx="250" cy="198" r="28" fill="#fff"/><circle cx="150" cy="198" r="5" fill="${ink}"/><circle cx="250" cy="198" r="5" fill="${ink}"/>`
    }[mood] || '';
    const mouth = mood === 'shock'
      ? `<ellipse cx="200" cy="270" rx="13" ry="17" fill="#7a3b4f"/>`
      : `<path d="M200 246 Q190 266 170 258 M200 246 Q210 266 230 258" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    let props = '';
    if (extra === 'phone') props = `<rect x="150" y="332" width="100" height="62" rx="12" fill="${ink}"/><rect x="157" y="339" width="86" height="42" rx="6" fill="#bde0fe"/><circle cx="185" cy="360" r="4" fill="#fff"/><circle cx="200" cy="360" r="4" fill="#fff"/><circle cx="215" cy="360" r="4" fill="#fff"/>`;
    if (extra === 'fries') props = [0,1,2,3,4,5].map((n) => `<rect x="${152 + n * 16}" y="328" width="12" height="48" rx="3" fill="#ffd23f"/>`).join('') + `<path d="M146 360 L254 360 L244 396 L156 396 Z" fill="#ff6b6b"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="${bg}"/>
      <polygon points="95,150 118,45 205,100" fill="${fur}"/><polygon points="305,150 282,45 195,100" fill="${fur}"/>
      <polygon points="118,125 128,75 170,105" fill="#ffb3c9"/><polygon points="282,125 272,75 230,105" fill="#ffb3c9"/>
      <ellipse cx="200" cy="205" rx="132" ry="108" fill="${fur}"/>
      <circle cx="125" cy="240" r="20" fill="#ff9ebb" opacity=".45"/><circle cx="275" cy="240" r="20" fill="#ff9ebb" opacity=".45"/>
      ${eyes}<path d="M188 232 L212 232 L200 246 Z" fill="#ff7fa3"/>${mouth}
      <path d="M70 225 L125 232 M68 250 L124 248 M330 225 L275 232 M332 250 L276 248" stroke="${ink}" stroke-width="3" opacity=".6" stroke-linecap="round"/>
      ${props}</svg>`;
  }
  const svgURI = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  // If an image fails to load, swap in a fallback
  function withFallback(img, fallbackSrc) { img.addEventListener('error', () => { img.src = fallbackSrc; }, { once: true }); }

  /* ---------- Fill text ---------- */
  $('hero-title').textContent = `Happy Boyfriend Day, ${CONFIG.boyfriendName}!`;
  $('hero-sub').textContent = CONFIG.heroSubtitle;
  $('footer').textContent = `Made with love by ${CONFIG.myName} 💖🐾`;
  $('hero-img').src = resolveSrc(CONFIG.heroImage);
  $('hero-img').alt = CONFIG.heroImageAlt;

  /* ---------- Reason cards ---------- */
  $('reasons-grid').innerHTML = CONFIG.reasons.map((r) => `
    <button class="flip reveal" aria-label="Reason: ${esc(r.title)}. Tap to flip.">
      <div class="flip-inner">
        <div class="face front"><span class="emoji">${r.emoji}</span><h3>${esc(r.title)}</h3></div>
        <div class="face back"><p>${esc(r.text)}</p></div>
      </div>
    </button>`).join('');
  document.querySelectorAll('.flip').forEach((c) => c.addEventListener('click', () => c.classList.toggle('flipped')));

  /* ---------- Memes ---------- */
  $('meme-grid').innerHTML = CONFIG.memes.map((m, i) => `
    <div class="reveal">
      <figure class="meme-card">
        <img src="${esc(resolveSrc(m.src))}" alt="${esc(m.alt)}" loading="lazy">
        <p>${esc(m.caption)}</p>
      </figure>
    </div>`).join('');
  document.querySelectorAll('.meme-card img').forEach((img, i) => {
    const m = CONFIG.memes[i];
    withFallback(img, svgURI(catSVG(m.mood, m.extra, i)));
  });

  /* ---------- Polaroids + photo viewer ---------- */
  const tilts = [-4, 3, -2, 4, -3, 2];
  $('polaroids').innerHTML = CONFIG.photos.map((p, i) => `
    <div class="reveal" style="--tilt:${tilts[i % tilts.length]}deg">
      <figure class="polaroid" data-i="${i}" tabindex="0" role="button" aria-label="Open photo: ${esc(p.caption)}" style="--tilt:${tilts[i % tilts.length]}deg">
        <img src="${esc(resolveSrc(p.src))}" alt="${esc(p.alt)}" loading="lazy" style="object-position:${esc(p.pos || '50% 50%')}">
        <figcaption>${esc(p.caption)}</figcaption>
      </figure>
    </div>`).join('');
  const lightbox = $('lightbox');
  function openPhoto(i) {
    const p = CONFIG.photos[i];
    $('lb-img').src = resolveSrc(p.src); $('lb-img').alt = p.alt;
    $('lb-cap').textContent = p.caption;
    lightbox.classList.add('open'); $('lb-close').focus();
  }
  document.querySelectorAll('.polaroid').forEach((el) => {
    el.addEventListener('click', () => openPhoto(+el.dataset.i));
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPhoto(+el.dataset.i); } });
  });
  $('lb-close').addEventListener('click', () => lightbox.classList.remove('open'));
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });

  /* ---------- Scroll reveal ---------- */
  const revealObs = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.remove('hide'); revealObs.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach((el) => {
    if (el.getBoundingClientRect().top < window.innerHeight * 0.95) return; // already on screen: visible at rest
    el.classList.add('hide'); revealObs.observe(el);
  });

  /* ---------- Typewriter letter ---------- */
  const letterEl = $('letter-text');
  const full = CONFIG.letter;
  const typedSpan = document.createElement('span');
  const ghostSpan = document.createElement('span');
  ghostSpan.className = 'ghost'; ghostSpan.setAttribute('aria-hidden', 'true');
  ghostSpan.textContent = full;
  letterEl.append(typedSpan, ghostSpan);
  letterEl.setAttribute('aria-label', full);
  let typed = false;
  function typeLetter() {
    if (typed) return; typed = true;
    if (reduceMotion) { typedSpan.textContent = full; ghostSpan.textContent = ''; return; }
    letterEl.classList.add('caret');
    let i = 0;
    (function step() {
      i++;
      typedSpan.textContent = full.slice(0, i);
      ghostSpan.textContent = full.slice(i);
      if (i < full.length) setTimeout(step, 22);
      else letterEl.classList.remove('caret');
    })();
  }
  new IntersectionObserver((entries, obs) => {
    if (entries[0].isIntersecting) { typeLetter(); obs.disconnect(); }
  }, { threshold: 0.35 }).observe(letterEl);

  /* ---------- Floating hearts ---------- */
  function spawnHeart() {
    const h = document.createElement('span');
    h.className = 'float-heart';
    h.textContent = ['💖', '💗', '💕', '🌸', '✨', '🐾'][Math.floor(Math.random() * 6)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = 14 + Math.random() * 20 + 'px';
    h.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
    const dur = 8 + Math.random() * 7;
    h.style.animationDuration = dur + 's';
    $('hearts-layer').appendChild(h);
    setTimeout(() => h.remove(), dur * 1000);
  }
  if (!reduceMotion) { for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 400); setInterval(spawnHeart, 1200); }

  /* ---------- Surprise pop-up + confetti ---------- */
  const modal = $('modal');
  function confettiBurst(count = 60) {
    if (reduceMotion) return;
    const bits = ['💖', '🎉', '✨', '🐱', '🌸', '💜', '🐾'];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = bits[Math.floor(Math.random() * bits.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = 16 + Math.random() * 20 + 'px';
      c.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
      const d = 2.5 + Math.random() * 2.5;
      c.style.animationDuration = d + 's';
      c.style.animationDelay = Math.random() * .6 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), (d + 1) * 1000);
    }
  }
  function openModal() {
    const img = $('modal-img');
    img.src = resolveSrc(CONFIG.surprise.image); img.alt = CONFIG.surprise.alt;
    withFallback(img, svgURI(catSVG('heart', 'none', 0)));
    $('modal-title').textContent = CONFIG.surprise.title;
    $('modal-msg').textContent = CONFIG.surprise.message;
    modal.classList.add('open');
    $('modal-close').focus();
    confettiBurst();
  }
  function closeModal() { modal.classList.remove('open'); $('surprise-btn').focus(); }
  $('surprise-btn').addEventListener('click', openModal);
  $('modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (modal.classList.contains('open')) closeModal();
    lightbox.classList.remove('open');
  });

  /* ---------- Small message bubble (alert() is blocked in shared pages) ---------- */
  function showToast(msg) {
    let t = $('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ---------- Music toggle (off by default) ---------- */
  const bgm = $('bgm'), musicBtn = $('music-btn');
  bgm.src = CONFIG.musicSrc;
  musicBtn.addEventListener('click', () => {
    if (bgm.paused) {
      bgm.play().then(() => { musicBtn.textContent = '🎵'; })
        .catch(() => { showToast('No music added yet 🎶'); });
    } else { bgm.pause(); musicBtn.textContent = '🔇'; }
  });
});
</script>
